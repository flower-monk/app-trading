<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Trading · 凭据管理</title>
    <script src="/static/core/i18n.js?v=20260817.3"></script>
    <script src="/static/core/theme.js?v=20260721.3"></script>
    <link rel="stylesheet" href="/static/styles/styles.css?v=20260722.1" />
    <link rel="stylesheet" href="/static/styles/admin.css?v=20260728.2" />
    <link rel="stylesheet" href="/static/styles/credentials.css?v=20260728.1" />
    <link rel="stylesheet" href="/static/styles/apple-polish.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/theme.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/admin-center.css?v=20260907.1" />
  </head>
  <body class="admin-page credential-page" data-admin-section="credentials">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand admin-brand" href="/">
          <div class="brand-mark">AT</div>
          <div><strong>App Trading</strong><span>凭据管理</span></div>
        </a>
        <nav class="credential-nav" aria-label="凭据导航">
          <strong>安全配置</strong>
          <a class="active" href="/credentials"><i data-lucide="key-round"></i><span>API 凭据</span></a>
          <a href="/data-sources"><i data-lucide="database-zap"></i><span>数据源</span></a>
          <a href="/admin"><i data-lucide="database"></i><span>资源管理</span></a>
          <a href="/agents"><i data-lucide="workflow"></i><span>Agent 管理</span></a>
          <a href="/schedules"><i data-lucide="calendar-clock"></i><span>定时任务</span></a>
        </nav>
        <a class="back-workspace" href="/"><i data-lucide="arrow-left"></i>返回盯盘工作台</a>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div><p class="eyebrow">凭据运维</p><h1>凭据管理</h1></div>
          <div class="admin-account">
            <span id="credentialUserLabel"></span>
            <button class="icon-button language-toggle" type="button" data-language-toggle title="Switch to English" aria-label="Switch to English">EN</button>
            <button id="credentialThemeToggle" class="icon-button theme-toggle" type="button" data-theme-toggle title="切换主题"><i data-lucide="sun"></i></button>
            <button id="credentialLogout" class="icon-button" type="button" title="退出登录"><i data-lucide="log-out"></i></button>
          </div>
        </header>

        <section id="credentialMetrics" class="resource-metrics" aria-label="凭据概览"></section>
        <div id="vaultBanner" class="vault-banner" hidden></div>

        <section class="credential-workbench">
          <div class="credential-toolbar">
            <div class="credential-search"><i data-lucide="search"></i><input id="credentialSearch" type="search" placeholder="搜索凭据、环境变量或绑定资源" /></div>
            <div class="page-actions">
              <button id="refreshCredentials" class="icon-button" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button>
              <button id="newCredential" class="primary-button admin-write" type="button"><i data-lucide="plus"></i>新增凭据</button>
            </div>
          </div>
          <div id="credentialNotice" class="resource-notice" role="status"></div>
          <div class="credential-table-wrap">
            <table class="credential-table">
              <thead><tr><th>凭据</th><th>来源</th><th>状态</th><th>绑定资源</th><th>最近轮换</th><th>连接检测</th><th>操作</th></tr></thead>
              <tbody id="credentialTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="credentialModal" class="modal-backdrop" hidden>
      <form id="credentialForm" class="resource-modal">
        <div class="panel-header compact"><div><p class="eyebrow">Credential</p><h2 id="credentialFormTitle">新增凭据</h2></div><button id="closeCredentialModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div class="resource-fields">
          <label><span>名称</span><input id="credentialName" maxlength="100" required /></label>
          <label><span>环境变量别名</span><input id="credentialEnvAlias" maxlength="120" placeholder="PROVIDER_API_KEY" required /></label>
          <label id="credentialSecretField"><span>API Key</span><input id="credentialSecret" type="password" maxlength="10000" autocomplete="new-password" /></label>
          <small id="credentialFormHint">密钥保存后不会再次明文显示。</small>
        </div>
        <div class="modal-actions"><button id="cancelCredentialModal" class="text-button" type="button">取消</button><button class="primary-button" type="submit">保存</button></div>
      </form>
    </div>

    <div id="rotateModal" class="modal-backdrop" hidden>
      <form id="rotateForm" class="resource-modal compact-modal">
        <div class="panel-header compact"><h2 id="rotateTitle">替换 API Key</h2><button id="closeRotateModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div class="resource-fields">
          <div id="rotateImpact" class="credential-inline-status"></div>
          <label><span>新 API Key</span><input id="rotateSecret" type="password" maxlength="10000" autocomplete="new-password" required /></label>
        </div>
        <div class="modal-actions"><button id="cancelRotateModal" class="text-button" type="button">取消</button><button class="primary-button" type="submit">替换并立即生效</button></div>
      </form>
    </div>

    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/core/admin-center.js?v=20260901.1"></script>
    <script src="/static/admin/credentials.js?v=20260901.1"></script>
  </body>
</html>
