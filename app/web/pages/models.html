<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Trading · 模型服务</title>
    <script src="/static/core/i18n.js?v=20260901.2"></script><script src="/static/core/theme.js?v=20260721.3"></script>
    <link rel="stylesheet" href="/static/styles/styles.css?v=20260827.1" /><link rel="stylesheet" href="/static/styles/admin.css?v=20260728.2" />
    <link rel="stylesheet" href="/static/styles/model-center.css?v=20260914.1" />
    <link rel="stylesheet" href="/static/styles/apple-polish.css?v=20260907.1" /><link rel="stylesheet" href="/static/styles/theme.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/admin-center.css?v=20260907.1" />
  </head>
  <body class="admin-page" data-admin-section="models">
    <div class="admin-shell"><aside class="admin-sidebar"></aside><main class="admin-main">
      <header class="admin-topbar"><div><p class="eyebrow">Model Control Plane</p><h1>模型服务</h1></div><div class="admin-account"><span data-admin-user></span><button class="icon-button language-toggle" type="button" data-language-toggle>EN</button><button class="icon-button theme-toggle" type="button" data-theme-toggle data-admin-theme title="切换主题"><i data-lucide="sun"></i></button><button class="icon-button" type="button" data-admin-logout title="退出登录"><i data-lucide="log-out"></i></button></div></header>
      <div class="admin-page-body"><section id="modelCenterView" class="model-center-view active">
        <div class="page-intro model-center-intro"><div><h2>模型运行与接入</h2><p>管理模型渠道、逻辑路由、调用审计与在线测试。</p></div></div>
        <div class="model-center-tabs segmented-control" role="tablist"><button class="active" type="button" data-model-tab="channels"><i data-lucide="waypoints"></i>模型渠道</button><button type="button" data-model-tab="routes"><i data-lucide="route"></i>逻辑模型</button><button type="button" data-model-tab="invocations"><i data-lucide="activity"></i>调用记录</button><button type="button" data-model-tab="playground"><i data-lucide="message-square"></i>测试聊天</button></div>
        <div id="modelNotice" class="model-notice" role="status"></div><div id="modelMetrics" class="model-metrics"></div>
        <section class="model-center-panel active" data-model-panel="channels"><div class="model-panel-heading"><div><h2>渠道连接</h2><p>管理上游端点与凭据，并同步可用模型。</p></div><button id="modelNewChannel" class="primary-button" type="button"><i data-lucide="plus"></i>新增渠道</button></div><div class="model-toolbar"><input id="modelChannelSearch" type="search" placeholder="搜索名称、供应商或模型" /><select id="modelChannelProvider"><option value="">全部供应商</option></select><select id="modelChannelStatus"><option value="">全部状态</option><option value="healthy">健康</option><option value="degraded">降级</option><option value="unavailable">不可用</option><option value="unknown">未检测</option><option value="disabled">已停用</option></select><span class="model-toolbar-spacer"></span><button id="modelBatchEnable" class="text-button" type="button">批量启用</button><button id="modelBatchDisable" class="text-button" type="button">批量停用</button></div><div class="model-table-wrap"><table class="model-table"><thead><tr><th><input id="modelSelectAllChannels" type="checkbox" /></th><th>渠道</th><th>供应商 / 协议</th><th>模型</th><th>健康</th><th>延迟</th><th>密钥</th><th>操作</th></tr></thead><tbody id="modelChannelRows"></tbody></table></div></section>
        <section class="model-center-panel" data-model-panel="routes"><div class="model-panel-heading"><div><h2>逻辑模型</h2><p>按优先级、权重与健康状态选择实际渠道。</p></div><button id="modelNewRoute" class="primary-button" type="button"><i data-lucide="plus"></i>新增逻辑模型</button></div><div class="model-toolbar"><input id="modelRouteSearch" type="search" placeholder="搜索名称或别名" /></div><div class="model-table-wrap"><table class="model-table"><thead><tr><th>逻辑模型</th><th>目标渠道</th><th>默认参数</th><th>状态</th><th>操作</th></tr></thead><tbody id="modelRouteRows"></tbody></table></div></section>
        <section class="model-center-panel" data-model-panel="invocations"><div class="model-panel-heading"><div><h2>调用记录</h2><p>模型、Token、耗时和脱敏错误。</p></div></div><div class="model-toolbar"><select id="modelInvocationStatus"><option value="">全部状态</option><option value="succeeded">成功</option><option value="failed">失败</option></select></div><div class="model-table-wrap"><table class="model-table"><thead><tr><th>时间</th><th>来源</th><th>渠道 / 模型</th><th>状态</th><th>Token</th><th>耗时</th><th>错误</th></tr></thead><tbody id="modelInvocationRows"></tbody></table></div></section>
        <section class="model-center-panel model-playground-panel" data-model-panel="playground"><div class="model-playground-toolbar"><label><span>逻辑模型</span><select id="modelPlaygroundRoute"></select></label><label><span>渠道锁定</span><select id="modelPlaygroundChannel"><option value="">自动路由</option></select></label><button id="modelPlaygroundSettingsToggle" class="text-button" type="button"><i data-lucide="sliders-horizontal"></i>请求设置</button></div><div class="model-playground-layout"><aside id="modelPlaygroundSettings" class="model-playground-settings"><div class="model-settings-heading"><strong>请求设置</strong><button id="modelClearChat" class="icon-button" type="button" title="清空会话"><i data-lucide="trash-2"></i></button></div><label><span>系统提示词</span><textarea id="modelSystemPrompt" rows="8"></textarea></label><label><span>温度 <b id="modelTemperatureValue">0.2</b></span><input id="modelTemperature" type="range" min="0" max="2" step="0.1" value="0.2" /></label><label><span>最大输出 Token</span><input id="modelMaxTokens" type="number" min="16" max="32000" value="1200" /></label></aside><section class="model-chat-panel"><div id="modelChatMessages" class="model-chat-messages"></div><div id="modelRunMeta" class="model-run-meta"></div><form id="modelChatForm" class="model-chat-composer"><textarea id="modelChatInput" rows="3" maxlength="30000" placeholder="输入测试消息" required></textarea><div><span id="modelChatStatus">就绪</span><button id="modelStopChat" class="text-button" type="button" hidden><i data-lucide="square"></i>停止</button><button id="modelSendChat" class="primary-button" type="submit"><i data-lucide="send"></i>发送</button></div></form></section></div></section>
        <div id="modelChannelModal" class="modal-backdrop" hidden><form id="modelChannelForm" class="resource-modal model-modal"><div class="panel-header compact"><h2 id="modelChannelModalTitle">新增渠道</h2><button class="icon-button" type="button" data-close-model-channel><i data-lucide="x"></i></button></div><div class="model-form-grid"><label><span>供应商</span><select id="modelChannelType" required></select></label><label><span>名称</span><input id="modelChannelName" required /></label><label><span>协议</span><select id="modelChannelProtocol"><option value="openai_chat">OpenAI Chat</option><option value="openai_responses">OpenAI Responses</option><option value="azure_openai">Azure OpenAI</option><option value="anthropic">Anthropic Messages</option><option value="gemini">Gemini</option></select></label><label><span>超时（秒）</span><input id="modelChannelTimeout" type="number" min="3" max="180" value="30" /></label><label class="wide"><span>Base URL</span><input id="modelChannelUrl" type="url" required /></label><label><span>凭据环境变量</span><input id="modelChannelEnv" /></label><label><span>API Key</span><input id="modelChannelKey" type="password" /></label><label class="wide"><span>模型</span><textarea id="modelChannelModels" rows="4"></textarea></label><label class="wide"><span>高级配置 JSON</span><textarea id="modelChannelConfig" rows="4">{}</textarea></label><label class="model-check"><input id="modelChannelEnabled" type="checkbox" checked /><span>启用渠道</span></label></div><div id="modelChannelFormError" class="model-form-error" role="alert" hidden></div><div class="modal-actions"><button class="text-button" type="button" data-close-model-channel>取消</button><button id="modelChannelSave" class="primary-button" type="submit">保存渠道</button></div></form></div>
        <div id="modelRouteModal" class="modal-backdrop" hidden><form id="modelRouteForm" class="resource-modal model-modal"><div class="panel-header compact"><h2 id="modelRouteModalTitle">新增逻辑模型</h2><button class="icon-button" type="button" data-close-model-route><i data-lucide="x"></i></button></div><div class="model-form-grid"><label><span>名称</span><input id="modelRouteName" required /></label><label><span>别名</span><input id="modelRouteAlias" required /></label><label><span>温度</span><input id="modelRouteTemperature" type="number" min="0" max="2" step="0.1" value="0.2" /></label><label><span>最大输出 Token</span><input id="modelRouteMaxTokens" type="number" value="1200" /></label><label class="wide"><span>说明</span><textarea id="modelRouteDescription"></textarea></label><label class="model-check"><input id="modelRouteEnabled" type="checkbox" checked /><span>启用逻辑模型</span></label><div class="wide"><div class="model-target-heading"><strong>路由目标</strong><button id="modelAddTarget" class="text-button" type="button"><i data-lucide="plus"></i>添加目标</button></div><div id="modelTargetList" class="model-target-list"></div></div></div><div class="modal-actions"><button class="text-button" type="button" data-close-model-route>取消</button><button class="primary-button" type="submit">保存逻辑模型</button></div></form></div>
      </section></div>
    </main></div>
    <script src="/static/vendor/lucide.min.js"></script><script src="/static/core/admin-center.js?v=20260901.1"></script><script src="/static/admin/model-center.js?v=20260914.1"></script><script>AdminCenter.ready.then((session) => ModelCenter.init({csrfToken: session.csrf_token, role: session.user.role})).catch(() => {});</script>
  </body>
</html>
