<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Trading · 数据源控制中心</title>
    <script src="/static/core/i18n.js?v=20260817.3"></script>
    <script src="/static/core/theme.js?v=20260721.3"></script>
    <link rel="stylesheet" href="/static/styles/styles.css?v=20260722.1" />
    <link rel="stylesheet" href="/static/styles/admin.css?v=20260728.2" />
    <link rel="stylesheet" href="/static/styles/apple-polish.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/theme.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/data-sources.css?v=20260902.1" />
    <link rel="stylesheet" href="/static/styles/admin-center.css?v=20260907.1" />
  </head>
  <body class="admin-page source-control-page" data-admin-section="data-sources">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand admin-brand" href="/"><div class="brand-mark">AT</div><div><strong>App Trading</strong><span>数据源控制中心</span></div></a>
        <nav class="source-control-nav" aria-label="数据源导航">
          <strong>数据接入</strong>
          <button class="active" type="button" data-source-tab="sources"><i data-lucide="database"></i><span>数据源</span></button>
          <button type="button" data-source-tab="calendar"><i data-lucide="calendar-days"></i><span>财经日历</span></button>
          <button type="button" data-source-tab="routes"><i data-lucide="route"></i><span>路由策略</span></button>
          <button type="button" data-source-tab="health"><i data-lucide="activity"></i><span>健康记录</span></button>
          <button type="button" data-source-tab="revisions"><i data-lucide="history"></i><span>配置版本</span></button>
        </nav>
        <div class="source-side-links">
          <a href="/credentials"><i data-lucide="key-round"></i>凭据管理</a>
          <a href="/schedules"><i data-lucide="calendar-clock"></i>定时任务</a>
          <a href="/admin"><i data-lucide="settings"></i>资源管理</a>
          <a href="/"><i data-lucide="arrow-left"></i>返回盯盘工作台</a>
        </div>
      </aside>
      <main class="admin-main">
        <header class="admin-topbar">
          <div><p class="eyebrow">Data Source Control Plane</p><h1>数据源控制中心</h1></div>
          <div class="admin-account"><span id="sourceUserLabel"></span><button class="icon-button language-toggle" type="button" data-language-toggle title="Switch to English">EN</button><button id="sourceThemeToggle" class="icon-button" type="button" data-theme-toggle title="切换主题"><i data-lucide="sun"></i></button><button id="sourceLogout" class="icon-button" type="button" title="退出登录"><i data-lucide="log-out"></i></button></div>
        </header>
        <section id="sourceMetrics" class="resource-metrics" aria-label="数据源概览"></section>
        <section class="source-workbench">
          <div class="source-toolbar">
            <div class="source-filters"><label><i data-lucide="search"></i><input id="sourceSearch" type="search" placeholder="搜索名称、提供方或适配器" /></label><select id="sourceDomain"><option value="">全部类型</option><option value="market">行情</option><option value="index">指数</option><option value="indicator">指标</option><option value="content">内容</option></select><button id="refreshSourceControl" class="icon-button" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button></div>
            <button id="newDataSource" class="primary-button admin-write" type="button"><i data-lucide="plus"></i>新增数据源</button>
          </div>
          <div id="sourceNotice" class="resource-notice" role="status"></div>
          <div id="sourceTabContent"></div>
        </section>
      </main>
    </div>

    <div id="sourceModal" class="modal-backdrop" hidden>
      <form id="sourceForm" class="resource-modal source-modal">
        <div class="panel-header compact"><div><p class="eyebrow">Data Source</p><h2 id="sourceFormTitle">编辑数据源</h2></div><button id="closeSourceModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div class="resource-fields source-form-grid">
          <label><span>名称</span><input id="sourceName" required maxlength="100" /></label>
          <label><span>类型</span><select id="sourceFormDomain"><option value="market">行情</option><option value="index">指数</option><option value="indicator">指标</option><option value="content">内容</option></select></label>
          <label><span>提供方</span><input id="sourceProvider" required maxlength="80" /></label>
          <label><span>适配器</span><select id="sourceAdapter"><option>finnhub</option><option>binance</option><option>coinbase</option><option>public_index</option><option>rss</option><option>adanos</option><option>gdelt</option><option>cryptocompare</option><option>alphavantage</option><option>fred</option><option>calendar_ics</option><option>bea_calendar</option><option>nbs_calendar</option><option>ecb_calendar</option><option>fomc_calendar</option><option>trading_economics</option></select></label>
          <label class="wide"><span>HTTPS 端点</span><input id="sourceEndpoint" required maxlength="2000" /></label>
          <label><span>覆盖市场</span><input id="sourceMarkets" placeholder="US, CN, CRYPTO" /></label>
          <label><span>资产类型</span><input id="sourceAssets" placeholder="stock, index" /></label>
          <label class="wide"><span>能力</span><input id="sourceCapabilities" placeholder="quote, snapshot, candles, news" required /></label>
          <label><span>认证方式</span><select id="sourceAuthType"><option value="none">无需认证</option><option value="query">Query API Key</option><option value="header">Header API Key</option><option value="bearer">Bearer Token</option></select></label>
          <label><span>凭据环境变量</span><input id="sourceApiKeyEnv" placeholder="PROVIDER_API_KEY" /></label>
          <label><span>超时秒数</span><input id="sourceTimeout" type="number" min="1" max="60" value="8" /></label>
          <label><span>缓存秒数</span><input id="sourceCacheTtl" type="number" min="0" value="60" /></label>
          <label><span>陈旧缓存秒数</span><input id="sourceStaleTtl" type="number" min="0" value="900" /></label>
          <label><span>同步周期</span><input id="sourceSyncInterval" type="number" min="300" max="86400" value="900" /></label>
          <label><span>来源时区</span><input id="sourceTimezone" value="UTC" placeholder="America/New_York" /></label>
          <label><span>优先级</span><input id="sourcePriority" type="number" min="0" max="100" value="50" /></label>
          <label class="wide"><span>扩展配置 JSON</span><textarea id="sourceConfig" rows="4">{}</textarea></label>
          <label class="resource-check wide"><input id="sourceEnabled" type="checkbox" checked /><span>启用数据源</span></label>
          <a class="credential-link wide" href="/admin/credentials">前往凭据管理</a>
        </div>
        <div class="modal-actions"><button id="cancelSourceModal" class="text-button" type="button">取消</button><button class="primary-button" type="submit">保存配置</button></div>
      </form>
    </div>

    <div id="routeModal" class="modal-backdrop" hidden>
      <form id="routeForm" class="resource-modal route-modal">
        <div class="panel-header compact"><div><p class="eyebrow">Atomic Publish</p><h2 id="routeFormTitle">编辑路由</h2></div><button id="closeRouteModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div class="route-editor-meta"><span id="routeVersion"></span><select id="routeMode"><option value="fallback">主备降级</option><option value="aggregate">聚合</option></select></div>
        <div class="route-add"><select id="routeSourcePicker"></select><button id="addRouteSource" class="text-button" type="button"><i data-lucide="plus"></i>加入路由</button></div>
        <div id="routeMemberEditor" class="route-member-editor"></div>
        <div id="routeValidationHint" class="source-publish-hint">发布前将依次检测所有来源；任何检测失败都不会改变当前路由。</div>
        <div class="modal-actions"><button id="cancelRouteModal" class="text-button" type="button">取消</button><button class="primary-button" type="submit"><i data-lucide="shield-check"></i>检测并原子发布</button></div>
      </form>
    </div>
    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/core/admin-center.js?v=20260901.1"></script>
    <script src="/static/admin/data-sources.js?v=20260902.1"></script>
  </body>
</html>
