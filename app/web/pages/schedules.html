<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Trading · 调度中心</title>
    <script src="/static/core/i18n.js?v=20260911.1"></script>
    <script src="/static/core/theme.js?v=20260721.3"></script>
    <link rel="stylesheet" href="/static/styles/styles.css?v=20260722.1" />
    <link rel="stylesheet" href="/static/styles/admin.css?v=20260721.3" />
    <link rel="stylesheet" href="/static/styles/schedules.css?v=20260726.1" />
    <link rel="stylesheet" href="/static/styles/apple-polish.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/theme.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/admin-center.css?v=20260907.1" />
  </head>
  <body class="admin-page schedule-page" data-admin-section="schedules">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand admin-brand" href="/">
          <div class="brand-mark">AT</div>
          <div><strong>App Trading</strong><span>调度中心</span></div>
        </a>
        <nav class="schedule-nav" aria-label="定时任务分类">
          <strong>任务视图</strong>
          <button class="active" type="button" data-schedule-type="">
            <i data-lucide="calendar-clock"></i><span>全部任务</span><b id="allTaskCount">0</b>
          </button>
          <button type="button" data-schedule-type="automation">
            <i data-lucide="activity"></i><span>平台自动化</span><b id="automationTaskCount">0</b>
          </button>
          <button type="button" data-schedule-type="news_source">
            <i data-lucide="rss"></i><span>新闻源轮询</span><b id="newsTaskCount">0</b>
          </button>
          <button type="button" data-schedule-type="data_source">
            <i data-lucide="database-zap"></i><span>数据源健康</span><b id="dataSourceTaskCount">0</b>
          </button>
          <button type="button" data-schedule-type="agent">
            <i data-lucide="bot"></i><span>Agent 调度</span><b id="agentTaskCount">0</b>
          </button>
          <button type="button" data-schedule-type="maintenance">
            <i data-lucide="database-backup"></i><span>数据维护</span><b id="maintenanceTaskCount">0</b>
          </button>
        </nav>
        <div class="schedule-side-links">
          <a href="/news-sources"><i data-lucide="rss"></i>新闻源管理</a>
          <a href="/data-sources"><i data-lucide="database-zap"></i>数据源管理</a>
          <a href="/credentials"><i data-lucide="key-round"></i>凭据管理</a>
          <a href="/admin"><i data-lucide="database"></i>资源管理</a>
          <a href="/agents"><i data-lucide="workflow"></i>Agent 管理</a>
          <a href="/"><i data-lucide="arrow-left"></i>返回盯盘工作台</a>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div>
            <p class="eyebrow">Schedule Operations</p>
            <h1>定时任务</h1>
          </div>
          <div class="admin-account">
            <span id="scheduleUserLabel"></span>
            <button class="icon-button language-toggle" type="button" data-language-toggle title="Switch to English" aria-label="Switch to English">EN</button>
            <button id="scheduleThemeToggle" class="icon-button theme-toggle" type="button" data-theme-toggle title="切换主题"><i data-lucide="sun"></i></button>
            <button id="scheduleLogout" class="icon-button" type="button" title="退出登录"><i data-lucide="log-out"></i></button>
          </div>
        </header>

        <section id="scheduleMetrics" class="resource-metrics" aria-label="调度概览"></section>

        <section class="schedule-workbench">
          <div class="schedule-toolbar">
            <div class="schedule-filters">
              <label class="schedule-search">
                <i data-lucide="search"></i>
                <input id="scheduleSearch" type="search" placeholder="搜索任务或归属" autocomplete="off" />
              </label>
              <select id="scheduleStatus" aria-label="任务状态">
                <option value="">全部状态</option>
                <option value="enabled">已启用</option>
                <option value="paused">已暂停</option>
                <option value="attention">阻塞或异常</option>
              </select>
              <button id="refreshSchedules" class="icon-button" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button>
            </div>
            <div class="schedule-actions admin-write">
              <span id="selectedTaskCount">未选择任务</span>
              <button id="bulkEnableSchedules" class="text-button" type="button" disabled>批量启用</button>
              <button id="bulkDisableSchedules" class="text-button" type="button" disabled>批量停用</button>
            </div>
          </div>
          <div id="scheduleNotice" class="resource-notice" role="status"></div>
          <div class="schedule-table-wrap">
            <table class="schedule-table">
              <thead>
                <tr>
                  <th><input id="selectAllSchedules" type="checkbox" aria-label="选择全部可见任务" /></th>
                  <th>任务</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>执行周期</th>
                  <th>最近运行</th>
                  <th>下次运行</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="scheduleTableBody"></tbody>
            </table>
          </div>
          <footer class="schedule-footer">
            <span id="visibleTaskCount">0 个任务</span>
            <span id="scheduleUpdatedAt">--</span>
          </footer>
        </section>
      </main>
    </div>

    <div id="scheduleModal" class="modal-backdrop" hidden>
      <form id="scheduleForm" class="resource-modal schedule-modal" role="dialog" aria-modal="true" aria-labelledby="scheduleFormTitle">
        <div class="panel-header compact">
          <div><p class="eyebrow">Schedule</p><h2 id="scheduleFormTitle">编辑定时任务</h2></div>
          <button id="closeScheduleModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button>
        </div>
        <div id="scheduleFormContext" class="schedule-form-context"></div>
        <div class="resource-fields">
          <label class="schedule-enabled-field">
            <span>调度状态</span>
            <span class="toggle-line"><input id="scheduleEnabled" type="checkbox" />启用定时执行</span>
          </label>
          <label>
            <span>执行周期</span>
            <div class="interval-editor">
              <input id="scheduleIntervalValue" type="number" required />
              <select id="scheduleIntervalUnit">
                <option value="1">秒</option>
                <option value="60">分钟</option>
                <option value="3600">小时</option>
              </select>
            </div>
            <small id="scheduleIntervalHint"></small>
          </label>
        </div>
        <div id="retentionFields" class="resource-fields" hidden>
          <label>
            <span>Checkpoint 保留天数</span>
            <input id="checkpointRetentionDays" type="number" min="1" max="3650" />
          </label>
          <label>
            <span>运行轨迹保留天数</span>
            <input id="traceRetentionDays" type="number" min="1" max="3650" />
          </label>
          <label>
            <span>投资产物保留天数</span>
            <input id="artifactRetentionDays" type="number" min="1" max="3650" />
          </label>
          <label class="schedule-enabled-field">
            <span>磁盘空间整理</span>
            <span class="toggle-line"><input id="vacuumAfterCleanup" type="checkbox" />清理后执行 SQLite VACUUM</span>
          </label>
        </div>
        <div class="modal-actions">
          <button id="cancelScheduleModal" class="text-button" type="button">取消</button>
          <button class="primary-button admin-write" type="submit">保存</button>
        </div>
      </form>
    </div>

    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/core/admin-center.js?v=20260901.1"></script>
    <script src="/static/admin/schedules.js?v=20260911.1"></script>
  </body>
</html>
