<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App Trading · 新闻源控制中心</title>
    <script src="/static/core/i18n.js?v=20260824.1"></script>
    <script src="/static/core/theme.js?v=20260721.3"></script>
    <link rel="stylesheet" href="/static/styles/styles.css?v=20260820.1" />
    <link rel="stylesheet" href="/static/styles/admin.css?v=20260728.2" />
    <link rel="stylesheet" href="/static/styles/schedules.css?v=20260726.1" />
    <link rel="stylesheet" href="/static/styles/news-sources.css?v=20260824.1" />
    <link rel="stylesheet" href="/static/styles/apple-polish.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/theme.css?v=20260907.1" />
    <link rel="stylesheet" href="/static/styles/admin-center.css?v=20260907.1" />
  </head>
  <body class="admin-page news-source-page" data-admin-section="news-sources">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand admin-brand" href="/"><div class="brand-mark">AT</div><div><strong>App Trading</strong><span>新闻源控制中心</span></div></a>
        <nav class="schedule-nav" aria-label="新闻源状态">
          <strong>监控视图</strong>
          <button class="active" type="button" data-source-status=""><i data-lucide="radio-tower"></i><span>全部来源</span><b id="allSourceCount">0</b></button>
          <button type="button" data-source-status="healthy"><i data-lucide="circle-check"></i><span>运行正常</span><b id="healthySourceCount">0</b></button>
          <button type="button" data-source-status="attention"><i data-lucide="triangle-alert"></i><span>需要处理</span><b id="attentionSourceCount">0</b></button>
          <button type="button" data-source-status="paused"><i data-lucide="circle-pause"></i><span>已停用</span><b id="pausedSourceCount">0</b></button>
        </nav>
        <div class="schedule-side-links">
          <a href="/news"><i data-lucide="newspaper"></i>查看新闻</a>
          <a href="/schedules"><i data-lucide="calendar-clock"></i>定时任务</a>
          <a href="/credentials"><i data-lucide="key-round"></i>凭据管理</a>
          <a href="/admin"><i data-lucide="database"></i>资源管理</a>
          <a href="/"><i data-lucide="arrow-left"></i>返回盯盘工作台</a>
        </div>
      </aside>
      <main class="admin-main">
        <header class="admin-topbar">
          <div><p class="eyebrow">News Source Operations</p><h1>新闻源控制中心</h1></div>
          <div class="admin-account">
            <span id="newsSourceUserLabel"></span>
            <button class="icon-button language-toggle" type="button" data-language-toggle title="Switch to English">EN</button>
            <button id="newsSourceThemeToggle" class="icon-button theme-toggle" type="button" title="切换主题"><i data-lucide="sun"></i></button>
            <button id="newsSourceLogout" class="icon-button" type="button" title="退出登录"><i data-lucide="log-out"></i></button>
          </div>
        </header>
        <section id="newsSourceMetrics" class="resource-metrics" aria-label="新闻源运行概览"></section>
        <section class="schedule-workbench">
          <div class="schedule-toolbar">
            <div class="schedule-filters">
              <label class="schedule-search"><i data-lucide="search"></i><input id="newsSourceSearch" type="search" placeholder="搜索名称、提供商或适配器" /></label>
              <select id="newsSourceAdapter"><option value="">全部接入方式</option><option value="rss">RSS / Atom</option><option value="finnhub">Finnhub</option><option value="cryptocompare">CryptoCompare</option><option value="gdelt">GDELT</option><option value="adanos">Adanos</option></select>
              <button id="reloadNewsSources" class="icon-button" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button>
            </div>
            <div class="news-source-toolbar-actions"><button id="refreshAllNewsSources" class="text-button admin-write" type="button"><i data-lucide="refresh-cw"></i>全部刷新</button><button id="createNewsSource" class="primary-button admin-write" type="button"><i data-lucide="plus"></i>新建来源</button></div>
          </div>
          <div id="newsSourceNotice" class="resource-notice" role="status"></div>
          <div class="schedule-table-wrap">
            <table class="schedule-table news-source-table">
              <thead><tr><th>来源</th><th>运行状态</th><th>刷新周期</th><th>最近运行</th><th>采集结果</th><th>24 小时</th><th>下次运行</th><th>操作</th></tr></thead>
              <tbody id="newsSourceTableBody"></tbody>
            </table>
          </div>
          <footer class="schedule-footer"><span id="visibleNewsSourceCount">0 个来源</span><span id="newsSourceUpdatedAt">--</span></footer>
        </section>
      </main>
    </div>

    <div id="newsSourceModal" class="modal-backdrop" hidden>
      <form id="newsSourceForm" class="resource-modal news-source-modal" role="dialog" aria-modal="true">
        <div class="panel-header compact"><div><p class="eyebrow">Source Config</p><h2 id="newsSourceFormTitle">编辑新闻源</h2></div><button id="closeNewsSourceModal" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div class="resource-fields news-source-fields">
          <label><span>名称</span><input id="editSourceName" required maxlength="100" /></label>
          <label><span>提供商</span><input id="editSourceProvider" required maxlength="60" /></label>
          <label class="field-wide"><span>地址</span><input id="editSourceUrl" type="url" required /></label>
          <label><span>类型</span><select id="editSourceType"><option value="rss">RSS / Atom</option><option value="rest_api">REST API</option><option value="reference">外部参考</option></select></label>
          <label><span>适配器</span><select id="editSourceAdapter"><option value="rss">RSS</option><option value="finnhub">Finnhub</option><option value="cryptocompare">CryptoCompare</option><option value="gdelt">GDELT</option><option value="adanos">Adanos</option><option value="alphavantage">Alpha Vantage</option><option value="fred">FRED</option></select></label>
          <label><span>刷新周期</span><div class="interval-editor"><input id="editSourceInterval" type="number" min="1" required /><select id="editSourceIntervalUnit"><option value="60">分钟</option><option value="3600">小时</option></select></div></label>
          <label><span>运行状态</span><span class="toggle-line"><input id="editSourceEnabled" type="checkbox" />启用独立轮询</span></label>
          <label class="field-wide"><span>关联标的</span><input id="editSourceSymbols" placeholder="AAPL, NVDA, BTCUSD；留空则自动识别" /></label>
        </div>
        <div class="modal-actions"><button id="cancelNewsSourceModal" class="text-button" type="button">取消</button><button class="primary-button admin-write" type="submit">保存</button></div>
      </form>
    </div>

    <div id="newsSourceRunsDrawer" class="drawer-backdrop" hidden>
      <aside class="admin-drawer news-source-runs" role="dialog" aria-modal="true">
        <div class="panel-header compact"><div><p class="eyebrow">Run History</p><h2 id="newsSourceRunsTitle">运行历史</h2></div><button id="closeNewsSourceRuns" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div>
        <div id="newsSourceRunsBody" class="admin-drawer-body"></div>
      </aside>
    </div>
    <div id="newsSourceDiagnosticDrawer" class="drawer-backdrop diagnostic-backdrop" hidden>
      <aside class="admin-drawer news-source-diagnostic" role="dialog" aria-modal="true" aria-labelledby="newsSourceDiagnosticTitle">
        <div class="panel-header compact"><div><p class="eyebrow">RSS Diagnostics</p><h2 id="newsSourceDiagnosticTitle">连接诊断</h2></div><div class="diagnostic-header-actions"><button id="copyNewsSourceDiagnostic" class="icon-button" type="button" title="复制诊断"><i data-lucide="copy"></i></button><button id="closeNewsSourceDiagnostic" class="icon-button" type="button" title="关闭"><i data-lucide="x"></i></button></div></div>
        <div id="newsSourceDiagnosticBody" class="admin-drawer-body"></div>
      </aside>
    </div>
    <script src="/static/vendor/lucide.min.js"></script>
    <script src="/static/core/admin-center.js?v=20260901.1"></script>
    <script src="/static/admin/news-sources.js?v=20260901.1"></script>
  </body>
</html>
